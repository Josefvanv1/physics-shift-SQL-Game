<script>
/* Physics Shift engine: hospital generator, ticket templates, grading */
(function (root) {
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);

    };

  function helpers(r) {
    const int = (a, b) => a + Math.floor(r() * (b - a + 1));

    const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

  }
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const DAYS_IN = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  const TODAY = '2026-10-28';

  const MODS = ['CT', 'MRI', 'Mammo', 'Fluoro', 'Radiography'];
  const DOSE_MODS = ['CT', 'Mammo', 'Fluoro', 'Radiography'];
  const MOD_INFO = {
    CT: { code: 'CT', n: 4, wings: ['Main', 'ED', 'West', 'Outpatient'], makers: ['Siemens', 'GE', 'Philips', 'Canon'] },
    MRI: { code: 'MR', n: 3, wings: ['Main', 'Outpatient', 'West'], makers: ['Siemens', 'GE', 'Philips'] },
    Mammo: { code: 'MG', n: 3, wings: ['Breast Center', 'Breast Center', 'Outpatient'], makers: ['Hologic', 'GE', 'Siemens', 'Fujifilm'] },
    Fluoro: { code: 'RF', n: 2, wings: ['Main', 'West'], makers: ['Siemens', 'Philips', 'GE'] },
    Radiography: { code: 'DX', n: 4, wings: ['ED', 'Main', 'Outpatient', 'West'], makers: ['Siemens', 'GE', 'Philips', 'Canon', 'Fujifilm'] },
  };
  const WING_CODE = { Main: 'MN', ED: 'ED', West: 'WS', Outpatient: 'OP', 'Breast Center': 'BC' };
  const WING_NAME = { MN: 'Main building', ED: 'Emergency Department', WS: 'West wing', OP: 'Outpatient center', BC: 'Breast Center' };
  const QC = {
    CT: [['CT number accuracy', 0, 5, 'HU'], ['Image noise', 5.0, 0.6, 'HU'], ['Uniformity', 0, 5, 'HU'], ['Slice thickness', 5.0, 1.0, 'mm']],
    MRI: [['Center frequency drift', 0, 3, 'ppm'], ['SNR', 120, 15, ''], ['Geometric accuracy', 0, 2, 'mm']],
    Mammo: [['Phantom image score', 4.5, 1.0, 'points'], ['AEC reproducibility', 0, 5, '%'], ['Phantom MGD', 1.6, 1.4, 'mGy']],
    Fluoro: [['Max air kerma rate', 60, 28, 'mGy/min'], ['HVL', 3.5, 1.0, 'mm Al']],
    Radiography: [['kVp accuracy', 0, 5, '%'], ['HVL', 3.0, 0.8, 'mm Al'], ['Collimation', 0, 2, '% SID']],
  };
  const PROTOCOLS = [
    ['CT', 'Routine head', 'CTDIvol', 57], ['CT', 'Chest', 'CTDIvol', 12], ['CT', 'Abdomen/pelvis', 'CTDIvol', 16],
    ['MRI', 'Brain', null, null], ['MRI', 'Knee', null, null], ['MRI', 'Lumbar spine', null, null],
    ['Mammo', 'Screening 2-view', 'MGD', 4.0], ['Mammo', 'Diagnostic', 'MGD', 5.0],
    ['Fluoro', 'Barium swallow', 'Ka,r', 60], ['Fluoro', 'Joint injection', 'Ka,r', 8],
    ['Radiography', 'Chest PA', 'ESAK', 0.2], ['Radiography', 'Knee', 'ESAK', 0.5], ['Radiography', 'Lumbar spine AP', 'ESAK', 3.5],
  ];
  const FIRST = ['Dana', 'Marcus', 'Priya', 'Tomás', 'Aisha', 'Ken', 'Lucia', 'Owen', 'Mei', 'Jamal', 'Sofia', 'Rahul', 'Grace', 'Nikolai', 'Hannah', 'Diego', 'Yuki', 'Femi', 'Clara', 'Ben'];
  const LAST = ['Ortiz', 'Chen', 'Patel', 'Walsh', 'Okafor', 'Nguyen', 'Brennan', 'Kowalski', 'Haddad', 'Lindqvist', 'Moreau', 'Sato', 'Mensah', 'Fischer', 'Reyes', 'Novak', 'Adeyemi', 'Rossi', 'Kim', 'Duarte'];

  const SCHEMA = `
CREATE TABLE staff (id INTEGER PRIMARY KEY, name TEXT, role TEXT, modality TEXT);
CREATE TABLE machines (id INTEGER PRIMARY KEY, name TEXT, modality TEXT, room TEXT, manufacturer TEXT, install_date TEXT, status TEXT);
CREATE TABLE protocols (id INTEGER PRIMARY KEY, modality TEXT, name TEXT, dose_metric TEXT, drl_mgy REAL);
CREATE TABLE qc_tests (id INTEGER PRIMARY KEY, machine_id INTEGER, test_name TEXT, test_date TEXT, result TEXT, measured_value REAL, unit TEXT, performed_by INTEGER);
CREATE TABLE exams (id INTEGER PRIMARY KEY, machine_id INTEGER, protocol_id INTEGER, exam_date TEXT, patient_age INTEGER, dose_mgy REAL, tech_id INTEGER);`;

  const TABLE_NOTES = {
    staff: 'Everyone in the department. Physicists and radiologists have no modality.',
    machines: 'Every imaging unit. status is "active" or "out of service".',
    protocols: 'Exam protocols. drl_mgy is the department reference level; MRI has none.',
    qc_tests: 'QC test log. result is "PASS" or "FAIL". performed_by is a staff id.',
    exams: 'Patient exams in 2026. dose_mgy is empty for MRI. tech_id is a staff id.',
  };

  function generate(SQL, seed) {
    const r = mulberry32(seed);
    const { int, pick, shuffle, gauss } = helpers(r);
    const db = new SQL.Database();
    db.run(SCHEMA);

    // staff
    const names = new Set();
    const newName = () => { let n; do { n = pick(FIRST) + ' ' + pick(LAST); } while (names.has(n)); names.add(n); return n; };
    const staff = [];
    for (let i = 0; i < 3; i++) staff.push([newName(), 'Physicist', null]);
    for (let i = 0; i < 3; i++) staff.push([newName(), 'Radiologist', null]);
    MODS.forEach((m) => { staff.push([newName(), 'Technologist', m]); staff.push([newName(), 'Technologist', m]); });
    const shuffled = shuffle(staff);
    const st = db.prepare('INSERT INTO staff (id,name,role,modality) VALUES (?,?,?,?)');
    shuffled.forEach((s, i) => st.run([i + 1, s[0], s[1], s[2]]));
    st.free();
    const staffRows = shuffled.map((s, i) => ({ id: i + 1, name: s[0], role: s[1], modality: s[2] }));
    const techsFor = (m) => staffRows.filter((s) => s.role === 'Technologist' && s.modality === m);
    const physicists = staffRows.filter((s) => s.role === 'Physicist');

    // protocols
    const pst = db.prepare('INSERT INTO protocols (id,modality,name,dose_metric,drl_mgy) VALUES (?,?,?,?,?)');
    PROTOCOLS.forEach((p, i) => pst.run([i + 1, p[0], p[1], p[2], p[3]]));
    pst.free();
    const protoRows = PROTOCOLS.map((p, i) => ({ id: i + 1, modality: p[0], name: p[1], drl: p[3] }));

    // machines
    const machines = [];
    MODS.forEach((m) => {
      const info = MOD_INFO[m];
      const roomsUsed = new Set();
      for (let i = 0; i < info.n; i++) {
        const wing = info.wings[i];
        let room; do { room = `${WING_CODE[wing]}-${int(1, 3)}${pad(int(1, 40))}`; } while (roomsUsed.has(room)); roomsUsed.add(room);
        machines.push({ name: `${info.code}-${i + 1} ${wing}`, modality: m, room, manufacturer: pick(info.makers), install_date: ymd(int(2012, 2025), int(1, 12), int(1, 28)), status: 'active', isNew: false });
      }
    });
    const ms = shuffle(machines.map((_, i) => i).filter((i) => MOD_INFO[machines[i].modality].n >= 3));
    const nNew = int(1, 2);
    for (let k = 0; k < nNew; k++) { const mm = machines[ms[k]]; mm.isNew = true; mm.install_date = ymd(2026, int(9, 10), int(1, 20)); }
    machines[ms[nNew]].status = 'out of service';
    machines.sort((a, b) => a.modality.localeCompare(b.modality) || a.name.localeCompare(b.name));
    const mst = db.prepare('INSERT INTO machines (id,name,modality,room,manufacturer,install_date,status) VALUES (?,?,?,?,?,?,?)');
    machines.forEach((m, i) => { m.id = i + 1; mst.run([m.id, m.name, m.modality, m.room, m.manufacturer, m.install_date, m.status]); });
    mst.free();

    // qc tests
    const qcs = [];
    const old = machines.filter((m) => !m.isNew);
    const forcedOverdue = new Set(shuffle(old).slice(0, 2).map((m) => m.id));
    old.forEach((m) => {
      const tests = QC[m.modality];
      const failBias = 0.06 + r() * 0.14;
      for (let mo = 1; mo <= 10; mo++) {
        const k = int(1, 2);
        shuffle(tests).slice(0, k).forEach((t) => {
          const fail = r() < failBias;
          const [nm, nom, tol, unit] = t;
          let v = fail ? nom + (r() < 0.5 ? -1 : 1) * tol * (1.08 + r() * 0.6) : nom + (r() * 2 - 1) * tol * 0.85;
          v = Math.round(v * 100) / 100;
          const by = r() < 0.7 ? pick(techsFor(m.modality)).id : pick(physicists).id;
          qcs.push([m.id, nm, ymd(2026, mo, int(1, 28)), fail ? 'FAIL' : 'PASS', v, unit || null, by]);
        });
      }
      const sd = forcedOverdue.has(m.id) ? ymd(2025, int(6, 9), int(1, 28)) : (r() < 0.25 ? ymd(2025, int(6, 10), int(1, 27)) : ymd(2025 + (r() < 0.5 ? 1 : 0), int(1, 10), int(1, 28)));
      const sdate = sd > TODAY ? '2026-10-15' : sd;
      qcs.push([m.id, 'Annual survey', sdate, r() < 0.1 ? 'FAIL' : 'PASS', null, null, pick(physicists).id]);
    });
    qcs.sort((a, b) => a[2].localeCompare(b[2]) || a[0] - b[0]);
    const qst = db.prepare('INSERT INTO qc_tests (id,machine_id,test_name,test_date,result,measured_value,unit,performed_by) VALUES (?,?,?,?,?,?,?,?)');
    qcs.forEach((q, i) => qst.run([i + 1, ...q]));
    qst.free();

    // exams
    const exams = [];
    old.forEach((m) => {
      const n = int(18, 42);
      const protos = protoRows.filter((p) => p.modality === m.modality);
      const lastMonth = m.status === 'out of service' ? 8 : 10;
      for (let i = 0; i < n; i++) {
        const p = pick(protos);
        const mo = int(1, lastMonth);
        const day = int(1, mo === 10 ? 27 : DAYS_IN[mo - 1]);
        const dose = p.drl == null ? null : Math.round(p.drl * Math.exp(gauss() * 0.3 - 0.22) * 100) / 100;
        exams.push([m.id, p.id, ymd(2026, mo, day), int(18, 92), dose, pick(techsFor(m.modality)).id]);
      }
    });
    exams.sort((a, b) => a[2].localeCompare(b[2]) || a[0] - b[0]);
    const est = db.prepare('INSERT INTO exams (id,machine_id,protocol_id,exam_date,patient_age,dose_mgy,tech_id) VALUES (?,?,?,?,?,?,?)');
    exams.forEach((e, i) => est.run([i + 1, ...e]));
    est.free();

    const bytes = db.export();
    db.close();
    return bytes;
  }

  // ---------- query helpers ----------
  function runOn(SQL, bytes, sql) {
    const d = new SQL.Database(bytes);
    try {
      const res = d.exec(sql);
      const last = res.length ? res[res.length - 1] : { columns: [], values: [] };
      return { columns: last.columns, rows: last.values };
    } catch (e) {
      return { error: String(e.message || e) };
    } finally { d.close(); }
  }
  function ctxFor(SQL, bytes, r, room) {
    const h = helpers(r);
    const inMod = MODS.includes(room);
    const mod = (list) => (inMod && list.includes(room) ? room : h.pick(list));
    const inRoom = (rows) => {
      if (!inMod || !rows.length) return rows;
      const key = 'modality' in rows[0] ? 'modality' : ('mod' in rows[0] ? 'mod' : null);
      if (!key) return rows;
      const f = rows.filter((x) => x[key] === room);
      if (!f.length) throw new Error('nothing for this room');
      return f;
    };
    const pickR = (rows) => h.pick(inRoom(rows));
    const d = new SQL.Database(bytes);
    const q = (sql) => { const res = d.exec(sql); if (!res.length) return []; const { columns, values } = res[0]; return values.map((v) => Object.fromEntries(columns.map((c, i) => [c, v[i]]))); };
    const qv = (sql) => { const res = d.exec(sql); return res.length ? res[0].values[0][0] : null; };
    const monthsWithData = () => q("SELECT DISTINCT substr(test_date,1,7) AS m FROM qc_tests WHERE test_date >= '2026-01-01' ORDER BY m").map((x) => x.m);
    return Object.assign({ mod, inRoom, pickR, room, q, qv, close: () => d.close(), monthName: (m) => MONTHS[Number(m.slice(5, 7)) - 1], monthEnd: (m) => `${m}-${pad(DAYS_IN[Number(m.slice(5, 7)) - 1])}`, monthsWithData, wingName: WING_NAME, r }, h);
  }
  const sqlStr = (s) => "'" + String(s).replace(/'/g, "''") + "'";

  // ---------- templates ----------
  // Each gen returns { room, prompt, sql, ordered?, broken?, hint } or for predict: { room, prompt, sample: sqlForSampleRows, query, hint }
  const T = [];
  const add = (o) => T.push(o);

  // ===== Tier 1 =====
  add({ id: 'mod-list', tier: 1, skill: 'where', gen(c) {
    const m = c.mod(MODS);
    return { room: m, prompt: `List the name and room of every ${m} unit.`, sql: `SELECT name, room\nFROM machines\nWHERE modality = '${m}';`,
      broken: `SELECT name, room\nFROM machines\nWHERE modality = ${m};`, hint: 'Text values in a WHERE filter go inside single quotes.' };
  } });
  add({ id: 'oldest', tier: 1, skill: 'order', gen(c) {
    const n = c.int(3, 5);
    return { room: 'Department', prompt: `Show the ${n} oldest machines by install date: name and install_date, oldest first.`, ordered: true,
      sql: `SELECT name, install_date\nFROM machines\nORDER BY install_date\nLIMIT ${n};`, broken: `SELECT name, install_date\nFROM machines\nORDER BY install_date DESC\nLIMIT ${n};`,
      hint: 'ORDER BY sorts ascending (oldest date first) by default. LIMIT keeps the first n rows.' };
  } });
  add({ id: 'wing', tier: 1, skill: 'like', gen(c) {
    const codes = c.q("SELECT DISTINCT substr(room,1,2) AS w FROM machines").map((x) => x.w);
    const w = c.pick(codes);
    return { room: 'Department', prompt: `Room codes in the ${c.wingName[w]} start with '${w}-'. List the name and room of every machine there.`,
      sql: `SELECT name, room\nFROM machines\nWHERE room LIKE '${w}-%';`, broken: `SELECT name, room\nFROM machines\nWHERE room = '${w}-%';`,
      hint: "LIKE does pattern matching. % stands for any run of characters, so 'ED-%' means 'starts with ED-'." };
  } });
  add({ id: 'two-mods', tier: 1, skill: 'in', gen(c) {
    const [a, b] = c.shuffle(MODS).slice(0, 2);
    return { room: 'Department', prompt: `List the name and modality of every ${a} or ${b} unit.`,
      sql: `SELECT name, modality\nFROM machines\nWHERE modality IN ('${a}', '${b}');`, broken: `SELECT name, modality\nFROM machines\nWHERE modality = '${a}' AND modality = '${b}';`,
      hint: "IN ('A', 'B') matches either value. A single row can't have two modalities at once, so AND returns nothing." };
  } });
  add({ id: 'oos', tier: 1, skill: 'where', gen() {
    return { room: 'Department', prompt: 'Which machines are out of service? Show the name and modality.',
      sql: "SELECT name, modality\nFROM machines\nWHERE status = 'out of service';", hint: 'Look at the status column in machines.' };
  } });
  add({ id: 'staff-role', tier: 1, skill: 'order', gen(c) {
    const role = c.pick(['Technologist', 'Physicist', 'Radiologist']);
    return { room: 'Department', prompt: `List every ${role.toLowerCase()}'s name, alphabetically.`, ordered: true,
      sql: `SELECT name\nFROM staff\nWHERE role = '${role}'\nORDER BY name;`, broken: `SELECT name\nFROM staff\nWHERE role = '${role.toLowerCase()}'\nORDER BY name;`,
      hint: `Text comparisons with = are case-sensitive. The role is stored as '${role}'.` };
  } });
  add({ id: 'manufacturers', tier: 1, skill: 'distinct', gen() {
    return { room: 'Department', prompt: 'Which manufacturers does the department use? List each one once, alphabetically.', ordered: true,

  add({ id: 'high-dose', tier: 1, skill: 'where', gen(c) {

      sql: 'SELECT name, role\nFROM staff\nWHERE modality IS NULL;', broken: 'SELECT name, role\nFROM staff\nWHERE modality = NULL;',

  add({ id: 'young', tier: 1, skill: 'where', gen(c) {
    const m = c.mod(DOSE_MODS); const age = c.pick([25, 30, 35]);
    const ids = c.q(`SELECT id FROM protocols WHERE modality='${m}'`).map((x) => x.id);
    return { room: m, prompt: `Radiologists want to review ${m} exams on patients younger than ${age}. ${m} protocols are ids ${ids.join(', ')}. Show exam id, patient_age, and dose_mgy.`,
      sql: `SELECT id, patient_age, dose_mgy\nFROM exams\nWHERE protocol_id IN (${ids.join(', ')})\n  AND patient_age < ${age};`, broken: `SELECT id, patient_age, dose_mgy\nFROM exams\nWHERE protocol_id IN (${ids.join(', ')})\n  AND patient_age <= ${age};`,
      hint: '"Younger than" means strictly less than.' };
  } });

  add({ id: 'mod-newest', tier: 1, skill: 'order', gen(c) {
    const m = c.mod(MODS);
    return { room: m, prompt: `List every ${m} unit's name and install_date, newest first.`, ordered: true,
      sql: `SELECT name, install_date\nFROM machines\nWHERE modality = '${m}'\nORDER BY install_date DESC;`,
      broken: `SELECT name, install_date\nFROM machines\nWHERE modality = '${m}'\nORDER BY install_date;`,
      hint: 'ORDER BY sorts oldest date first. Add DESC to put the newest first.' };
  } });
  add({ id: 'mod-maker', tier: 1, skill: 'distinct', gen(c) {
    const m = c.mod(MODS);
    return { room: m, prompt: `Which manufacturers make the department's ${m} units? List each manufacturer once, alphabetically.`, ordered: true,
      sql: `SELECT DISTINCT manufacturer\nFROM machines\nWHERE modality = '${m}'\nORDER BY manufacturer;`,
      broken: `SELECT manufacturer\nFROM machines\nWHERE modality = '${m}'\nORDER BY manufacturer;`,
      hint: 'Two units from the same manufacturer give two rows. SELECT DISTINCT keeps one of each.' };
  } });
  add({ id: 'name-like', tier: 1, skill: 'like', gen(c) {
    const m = c.mod(MODS), code = MOD_INFO[m].code;
    return { room: m, prompt: `${m} unit names start with '${code}-'. Using the name column, not modality, list the name and room of every ${m} unit.`,
      sql: `SELECT name, room\nFROM machines\nWHERE name LIKE '${code}-%';`,

  add({ id: 'proto-in', tier: 1, skill: 'in', gen(c) {
    const m = c.mod(MODS);

    ['CASE', ['case']], ['Subqueries', ['subquery']], ['Window fns', ['window']], ['CTEs', ['cte']],
  ];
  const skillTier = (k) => Math.min(...E.TEMPLATES.filter((t) => t.skill === k).map((t) => t.tier));
  function groupStat(keys) { let n = 0, ok = 0; keys.forEach((k) => { const v = S.skills[k]; if (v) { n += v.n; ok += v.ok; } }); return { n, ok }; }
  function radarSVG() {
    const N = GROUPS.length, R = 128;
    const pt = (i, r) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / N; return [Math.cos(a) * r, Math.sin(a) * r]; };
    const poly = (r) => GROUPS.map((_, i) => pt(i, r).map((v) => v.toFixed(1)).join(',')).join(' ');
    let s = `<svg class="radar" viewBox="0 0 470 370" role="img" aria-label="Radar chart of first-try accuracy for each skill group"><g transform="translate(235 185)">`;
    [0.25, 0.5, 0.75, 1].forEach((f) => { s += `<polygon class="ring" points="${poly(R * f)}"/>`; });
    s += `<text class="ring-label" x="-6" y="${-R * 0.5 + 12}" text-anchor="end">50%</text><text class="ring-label" x="-6" y="${-R + 14}" text-anchor="end">100%</text>`;
    GROUPS.forEach((_, i) => { const [x, y] = pt(i, R); s += `<line class="spoke" x1="0" y1="0" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; });
    const vals = GROUPS.map(([, keys]) => { const g = groupStat(keys); return g.n ? g.ok / g.n : null; });
    s += `<g id="radarGrow"><polygon class="radar-shape" points="${GROUPS.map((_, i) => pt(i, R * (vals[i] || 0)).map((v) => v.toFixed(1)).join(',')).join(' ')}"/>`;
    vals.forEach((v, i) => { if (v !== null) { const [x, y] = pt(i, R * v); s += `<circle class="radar-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"/>`; } });
    s += '</g>';
    GROUPS.forEach(([name], i) => {
      const [x, y] = pt(i, R + 20), anchor = x > 12 ? 'start' : x < -12 ? 'end' : 'middle', dy = y < -R ? -12 : y > R ? 14 : 0;
      const v = vals[i];
      s += `<text class="axis-label${v === null ? ' none' : ''}" x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}">${name}<tspan class="axis-val" x="${x.toFixed(1)}" dy="15">${v === null ? 'not tried' : Math.round(v * 100) + '%'}</tspan></text>`;
    });
    return s + '</g></svg>';
  }
  function growRadar() {
    const g = document.getElementById('radarGrow'); if (!g || reduceMotion()) return;
    const t0 = performance.now(), dur = 700;
    const step = (t) => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); g.setAttribute('transform', `scale(${e.toFixed(3)})`); if (k < 1) requestAnimationFrame(step); };
    g.setAttribute('transform', 'scale(0)'); requestAnimationFrame(step);
  }
  function renderStats() {
    view = 'stats'; cm = null;
    const acc = S.graded ? Math.round((100 * S.clean) / S.graded) : null;
    const tierNow = S.tierMode === 'auto' ? S.tier : Number(S.tierMode);
    const dots = [0, 1, 2, 3, 4].map((i) => { const h = S.history[i]; return `<span class="pdot ${h === undefined ? '' : h ? 'ok' : 'miss'}"></span>`; }).join('');
    const promo = S.tierMode !== 'auto' ? `Locked to tier ${S.tierMode}. Switch to Adaptive to move between tiers.`
      : S.tier >= 5 ? 'Top tier. Keep your first-try rate up to stay here.'
      : `4 first-try passes in your last 5 tier ${S.tier} tickets moves you up.`;
    const keys = Object.keys(E.SKILLS).sort((a, b) => skillTier(a) - skillTier(b));
    const rows = keys.map((k) => {
      const v = S.skills[k], p = pct(v), mt = skillTier(k), open = S.tierMode !== 'auto' || mt <= S.maxTier;
      const weak = v && v.n >= 2 && v.ok / v.n < 0.6;
      return `<tr class="${weak ? 'weak' : ''}"><td><span class="sk-name">${esc(E.SKILLS[k])}</span></td><td class="sk-tier">T${mt}</td>
        <td class="sk-n">${v ? `${v.ok}/${v.n}` : '–'}</td>
        <td><div class="sk-acc"><span class="sk-bar"><span style="width:${p || 0}%"></span></span><span class="sk-pct">${p === null ? '' : p + '%'}</span></div></td>
        <td class="sk-act">${open ? `<button class="btn small" type="button" data-practice="${k}">Practice</button>` : `<span class="muted">Tier ${mt}</span>`}</td></tr>`;
    }).join('');
    const rooms = E.ROOMS.map((r) => { const v = S.rooms[r], p = pct(v); return `<div class="rs-card" style="${roomStyle(r)}"><b>${ROOM_LABEL[r]}</b><span class="rs-num">${p === null ? '–' : p + '%'}</span><span class="rc-bar"><span style="width:${p || 0}%"></span></span><span class="muted">${v ? v.n + ' ticket' + (v.n === 1 ? '' : 's') : unlocked(r) ? 'Not started' : 'Locked'}</span></div>`; }).join('');
    $('#app').innerHTML = `
      <nav class="crumbs"><button class="btn quiet back" type="button" id="bMap3">← Department map</button><span class="crumb-room" style="${roomStyle('Department')}"><span class="room-dot"></span>Physics office · your stats</span></nav>
      <div class="statsview">
        <section class="panel tiles">
          <div class="tile"><span class="t-label">Tier</span><b>${tierNow}</b><span class="pdots" aria-label="Last five tickets at this tier">${dots}</span><span class="t-note">${promo}</span></div>
          <div class="tile"><span class="t-label">Tickets closed</span><b>${S.solved}</b><span class="t-note">${S.graded} graded so far</span></div>
          <div class="tile"><span class="t-label">First-try rate</span><b>${acc === null ? '–' : acc + '%'}</b><span class="t-note">Passed with no wrong submits and no revealed answer</span></div>
          <div class="tile"><span class="t-label">Best streak</span><b>${S.best}</b><span class="t-note">Current streak: ${S.streak}</span></div>
        </section>
        <div class="stats-grid">
          <section class="panel radar-panel"><h2 class="panel-title">Skill shape</h2><p class="muted">First-try accuracy for each group of skills. A fuller shape means fewer weak spots.</p>${radarSVG()}</section>
          <section class="panel skills-panel"><h2 class="panel-title">Every skill <small>practice one to get a run of only that skill</small></h2>
            <div class="sk-wrap"><table class="sk-table"><thead><tr><th>Skill</th><th class="sk-tier">Tier</th><th class="sk-n">Passed</th><th>First-try</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>
        </div>
        <section class="panel rooms-panel"><h2 class="panel-title">By room</h2><div class="rs-grid">${rooms}</div></section>
        <div class="reset-row"><button class="btn quiet" type="button" id="bResetAll">Reset progress</button></div>
      </div>`;
    $('#bMap3').onclick = renderMap;
    $('#app').querySelectorAll('[data-practice]').forEach((b) => b.addEventListener('click', () => { focus = b.dataset.practice; view = 'stats'; nextSpec(null); }));
    $('#bResetAll').onclick = (e) => {
      const b = e.currentTarget;
      if (!b.dataset.confirm) { b.dataset.confirm = '1'; b.textContent = 'Click again to erase all progress'; setTimeout(() => { if (b.isConnected) { delete b.dataset.confirm; b.textContent = 'Reset progress'; } }, 3000); return; }
      S = Object.assign(fresh(), { seed: S.seed, inboxSeed: S.seed, theme: S.theme });
      fillInbox(); save(); updateStats(); renderStats(); toast('Progress reset. Back to tier 1.');
    };
    window.scrollTo({ top: 0 });
    growRadar();
  }

  // ---------- the desk ----------
  function openSpec(spec) {
    if (!spec) return;
    const t = E.TEMPLATES.find((x) => x.id === spec.tid);
    const k = t && E.makeTicket(SQL, bytes, t, spec.seed, null, spec.room);
    if (!k) { S.inbox = S.inbox.filter((s) => s.id !== spec.id); fillInbox(); return view === 'map' ? renderMap() : nextSpec(null); }
    ticket = k; ticket.spec = spec;
    ticket.sender = staff.find((s) => s.id === spec.from) || senderFor(spec.room);
    last = [t.id, ...last].slice(0, 5);
    Object.assign(tk, { firstTry: true, revealed: false, hinted: false, recorded: false, solved: false });
    if (view !== 'desk') renderShell();
    view = 'desk';
    renderNav(); renderTicket(); renderWorkspace();
    ['#ticket', '#work'].forEach((sel) => { const el = $(sel); el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); });
    window.scrollTo({ top: 0 });
  }
  function nextSpec(room) {
    if (focus) {
      const sp = makeSpec(null, focus);
      if (sp) { S.inbox.push(sp); save(); return openSpec(sp); }
      toast(`No ${E.SKILLS[focus]} tickets available right now.`); focus = null;
    }
    if (!S.inbox.length) fillInbox();
    const sameRoom = room ? S.inbox.filter((s) => s.room === room) : [];
    const pool = sameRoom.length ? sameRoom : S.inbox;
    const weak = weakSkills();
    const pick = pool.find((s) => weak.includes(s.skill)) || pool[0];
    if (pick) openSpec(pick); else renderMap();
  }

  function renderShell() {
    $('#app').innerHTML = `
      <nav class="crumbs" id="nav"></nav>
      <div class="desk">
        <section class="panel ticket" id="ticket" aria-live="polite"></section>
        <section class="panel work" id="work"></section>
        <section class="panel schema" id="schema"></section>
      </div>`;
    renderSchema();
  }
  function renderNav() {
    const here = S.inbox.filter((s) => s.room === ticket.room && s.id !== ticket.spec.id).length;
    $('#nav').innerHTML = `<button class="btn quiet back" type="button" id="bMap">← Department map</button>
      <span class="crumb-room" style="${roomStyle(ticket.room)}"><span class="room-dot"></span>${ROOM_LABEL[ticket.room]}</span>
      ${focus ? `<span class="focus-pill">Practicing ${esc(E.SKILLS[focus])}<button type="button" id="bStopFocus">Stop</button></span>`
        : `<span class="muted">${here ? `${here} more open here` : 'Last open ticket in this room'} · ${S.inbox.length} open total</span>`}
      <button class="btn quiet nav-stats" type="button" id="bStats2">Your stats</button>`;
    $('#bMap').onclick = () => { focus = null; renderMap(); };
    $('#bStats2').onclick = () => { focus = null; renderStats(); };
    if (focus) $('#bStopFocus').onclick = () => { focus = null; renderNav(); toast('Back to the regular inbox.'); };
  }

  function renderSchema() {
    const order = ['machines', 'qc_tests', 'exams', 'protocols', 'staff'];
    $('#schema').innerHTML = `<h2 class="panel-title">Database <small>click a column to insert it</small></h2>` + order.map((t, i) => `
      <details class="tbl" ${i < 2 ? 'open' : ''}>
        <summary>${t}<span class="rows">${schema[t].n} rows</span></summary>
        <p class="tbl-note">${esc(E.TABLE_NOTES[t])}</p>
        <div class="cols">${schema[t].cols.map((c) => `<button class="col-btn" type="button" data-ins="${c.name}">${c.name}<i>${c.type.toLowerCase()}</i></button>`).join('')}
          <button class="col-btn" type="button" data-peek="${t}">preview</button></div>
      </details>`).join('');
    $('#schema').onclick = (e) => {
      const ins = e.target.closest('[data-ins]'), peek = e.target.closest('[data-peek]');
      if (ins && cm && ticket.type !== 'predict') { cm.replaceSelection(ins.dataset.ins); cm.focus(); }
      if (peek) { const t = peek.dataset.peek; showRun(E.runOn(SQL, bytes, `SELECT * FROM ${t} LIMIT 12;`), `Preview of ${t} (first 12 rows)`); }
    };
  }

  function renderTicket() {
    const t = ticket, el = $('#ticket');
    el.setAttribute('style', roomStyle(t.room));
    el.classList.remove('stamped');
    const s = t.sender;
    const roleTxt = s.role === 'Technologist' ? `${ROOM_LABEL[s.modality] || s.modality} technologist` : s.role.toLowerCase();
    let extra = '';
    if (t.type === 'match') {
      const uses = Object.entries(t.uses || {}).map(([tb, cols]) => `<span class="use"><b>${tb}</b>${cols.length ? ' ' + cols.map(esc).join(', ') : ''}</span>`).join('');
      const anyCalc = (t.headers || []).some((h) => h.calc);
      extra = `<div class="answer-box"><span class="label">What it shows</span><p class="shows">${esc(t.prompt)}</p></div>
        <div class="answer-box"><span class="label">Target result · ${t.expected.rows.length} row${t.expected.rows.length === 1 ? '' : 's'}${t.ordered ? ' · order matters' : ''}</span>${tableHTML(t.headers || t.expected.columns, t.expected.rows)}
        <span class="from">${anyCalc ? 'Italic headers are calculated values. ' : ''}Your column names don't need to match.</span></div>
        <div class="answer-box"><span class="label">Tables and columns involved</span><div class="uses">${uses}</div></div>`;
    }
    if ((t.type === 'write' || t.type === 'fix') && t.headers) extra = colsBox(t);
    if (t.type === 'fix') extra += `<div class="from">The query is loaded in the editor. Run it, find the bug, fix it.</div>`;
    if (t.type === 'predict') extra = `<div class="answer-box"><span class="label">Table: sample</span>${tableHTML(t.sample.columns, t.sample.rows)}</div><div class="answer-box"><span class="label">Query</span><pre class="code">${esc(t.query)}</pre></div>`;
    const promptTxt = t.type === 'fix' ? `I tried to answer this and my query isn't right: "${esc(t.prompt)}"`
      : t.type === 'match' ? `Write a query that produces exactly this table. ${t.ordered ? 'Row order matters.' : 'Row order doesn\'t matter.'}`
      : esc(t.prompt);
    el.innerHTML = `
      <div class="ticket-band">
        <span class="room-name"><span class="room-dot"></span>${ROOM_LABEL[t.room] || t.room}</span>
        <span class="chips"><span class="chip type">${TYPE_LABEL[t.type]}</span><span class="chip">Tier ${t.template.tier}</span><span class="chip">${E.SKILLS[t.template.skill]}</span></span>
      </div>
      <div class="ticket-body">
        <div class="from">From <b>${esc(s.name)}</b>, ${roleTxt}</div>
        <p class="prompt">${promptTxt}</p>
        ${extra}
        <div id="hintBox"></div>
        <div id="solBox"></div>
        <div class="ticket-actions" id="tActions"></div>
      </div>
      <div class="stamp" id="stamp" hidden></div>`;
    renderTicketActions();
  }

  function colsBox(t) {
    const n = t.headers.length;
    return `<div class="answer-box"><span class="label">Return ${n === 1 ? 'this column' : `these ${n} columns`}</span>
      <ol class="need-cols">${t.headers.map((h) => `<li class="${h.calc ? 'calc' : ''}">${esc(h.text)}</li>`).join('')}</ol>
      <span class="from">${n > 1 ? 'Any column order works. ' : ''}${t.headers.some((h) => h.calc) ? 'Italic items are values you calculate. ' : ''}Column names and aliases don't matter.</span></div>`;
  }
  function finishTicket() {
    // ticket resolved (passed or answer shown): free its slot and bring in a new ticket
    if (ticket.closed) return;
    ticket.closed = true;
    closeSpec(ticket.spec, !focus);
    renderNav();
  }

  function renderTicketActions() {
    const a = $('#tActions');
    if (tk.solved || tk.revealed) {
      a.innerHTML = `<button class="btn primary" type="button" id="bNext">Next ticket →</button><button class="btn" type="button" id="bBack">Back to map</button>`;
      $('#bNext').onclick = () => nextSpec(ticket.room);
      $('#bBack').onclick = renderMap;
      return;
    }
    a.innerHTML = `
      <button class="btn" type="button" id="bHint" ${tk.hinted ? 'hidden' : ''}>Hint</button>
      <button class="btn" type="button" id="bReveal">Show answer</button>
      <button class="btn quiet" type="button" id="bSkip">Skip</button>`;
    $('#bHint').onclick = () => { tk.hinted = true; $('#hintBox').innerHTML = `<div class="hint"><b>Hint:</b> ${esc(ticket.hint)}</div>`; renderTicketActions(); };
    $('#bReveal').onclick = () => { tk.revealed = true; record(false); showSolution(); stamp('fail', 'Reviewed'); finishTicket(); renderTicketActions(); };
    $('#bSkip').onclick = () => { const room = ticket.room; S.inbox = S.inbox.filter((s) => s.id !== ticket.spec.id); arrive(); fillInbox(); nextSpec(room); };
  }

  function showSolution(label = 'One correct answer') {
    const t = ticket;
    const body = t.type === 'predict' ? `<pre class="code">${esc(t.answer === null ? 'NULL' : t.answer)}</pre>` : `<pre class="code">${esc(t.sql)}</pre>`;
    $('#solBox').innerHTML = `<div class="solution"><span class="label">${label}</span>${body}</div>`;
  }

  function stamp(kind, text) {
    $('#ticket').classList.add('stamped');
    const s = $('#stamp'); s.hidden = false; s.className = 'stamp ' + kind; s.textContent = text;
    void s.offsetWidth; s.classList.add('show');
  }

  function renderWorkspace() {
    const t = ticket, w = $('#work');
    if (t.type === 'predict') {
      cm = null;
      w.innerHTML = `
        <div class="work-head"><h2>Your prediction</h2></div>
        <div class="predict">
          <label for="pAns">Work it out from the sample table. You can't run this one.</label>
          <div class="predict-row"><input id="pAns" autocomplete="off" placeholder="${typeof t.answer === 'number' ? '3' : '2026-05-14'}"><button class="btn primary" type="button" id="bPred">Submit</button></div>
        </div>
        <div id="status"></div><div class="results" id="results"><div class="empty-res">Your result will show here.</div></div>`;
      const go = () => {
        if (tk.solved) return;
        const v = $('#pAns').value;
        if (!v.trim()) { setStatus('bad', 'Type an answer first.'); return; }
        if (E.checkPredict(t, v)) { tk.solved = true; record(tk.firstTry); S.solved++; save(); updateStats(); stamp('pass', 'Pass'); setStatus('ok', `<b>Correct.</b> The query returns ${esc(t.answer)}.`); finishTicket(); renderTicketActions(); }
        else { tk.firstTry = false; record(false); stamp('fail', 'Fail · retest'); setStatus('bad', '<b>Not quite.</b> Look again, or use the hint.'); }
      };
      $('#bPred').onclick = go;
      $('#pAns').onkeydown = (e) => { if (e.key === 'Enter') go(); };
      return;
    }
    const start = t.type === 'fix' ? t.broken : `-- ${t.type === 'match' ? 'Produce the target table' : 'Write your query here'}\n`;
    w.innerHTML = `
      <div class="work-head"><h2>Query editor</h2><button class="btn quiet" type="button" id="bReset">Reset editor</button></div>
      <div class="editor-wrap"><textarea id="ed"></textarea></div>
      <div class="bar">
        <button class="btn" type="button" id="bRun">Run <kbd>Ctrl ↵</kbd></button>
        <button class="btn primary" type="button" id="bSubmit">Submit <kbd>Ctrl ⇧ ↵</kbd></button>
      </div>
      <div id="status"></div>
      <div class="results" id="results"><div class="empty-res">Run your query to see results here.</div></div>`;
    const hintTables = {}; Object.entries(schema).forEach(([k, v]) => { hintTables[k] = v.cols.map((c) => c.name); });
    cm = CodeMirror.fromTextArea($('#ed'), {
      mode: 'text/x-sqlite', theme: 'shift', lineNumbers: true, indentUnit: 2, tabSize: 2, lineWrapping: true,
      hintOptions: { tables: hintTables, completeSingle: false },
      extraKeys: { 'Ctrl-Enter': run, 'Cmd-Enter': run, 'Shift-Ctrl-Enter': submit, 'Shift-Cmd-Enter': submit, 'Ctrl-Space': 'autocomplete', Tab: (c) => c.execCommand('insertSoftTab') },
    });
    cm.on('inputRead', (c, ch) => { if (/^[a-zA-Z_.]$/.test(ch.text[0]) && !c.state.completionActive) { const tok = c.getTokenAt(c.getCursor()); if (ch.text[0] === '.' || (tok.string.length >= 2 && tok.type !== 'string' && tok.type !== 'comment')) c.showHint({ completeSingle: false }); } });
    cm.setValue(start); cm.setCursor(cm.lineCount(), 0);
    setTimeout(() => cm.refresh(), 0);
    $('#bRun').onclick = run; $('#bSubmit').onclick = submit;
    $('#bReset').onclick = () => { cm.setValue(start); cm.focus(); };
  }

  function setStatus(kind, html) { $('#status').innerHTML = html ? `<div class="status ${kind}"><span class="msg">${html}</span></div>` : ''; }
  function showRun(res, title) {
    const r = $('#results');
    if (res.error) { setStatus('bad', `<b>SQL error:</b> ${esc(res.error)}`); r.innerHTML = ''; return; }
    if (title) setStatus('info', esc(title)); else setStatus('', '');
    r.innerHTML = `<div class="res-meta"><span>${res.rows.length} row${res.rows.length === 1 ? '' : 's'}</span><span>${res.columns.length} column${res.columns.length === 1 ? '' : 's'}</span></div>` + tableHTML(res.columns, res.rows);
  }
  function run() { if (!cm) return; showRun(E.runOn(SQL, bytes, cm.getValue())); }

  function submit() {
    if (!cm || tk.solved) return;
    const sql = cm.getValue();
    if (!sql.replace(/--.*$/gm, '').trim()) { setStatus('bad', 'Write a query before submitting.'); return; }
    const got = E.runOn(SQL, bytes, sql);
    const v = E.compare(ticket.expected, got, ticket.ordered);
    const r = $('#results');
    if (v.ok) {
      tk.solved = true;
      if (!tk.revealed) { record(tk.firstTry); S.solved++; save(); updateStats(); }
      stamp('pass', 'Pass');
      setStatus('ok', tk.firstTry && !tk.revealed ? `<b>Ticket closed.</b> ${S.streak > 2 ? `${S.streak} in a row.` : 'First try.'}` : '<b>Ticket closed.</b>');
      r.innerHTML = `<div class="res-meta"><span>${got.rows.length} row${got.rows.length === 1 ? '' : 's'}</span></div>` + tableHTML(got.columns, got.rows);
      if (!tk.revealed) showSolution('Another way to write it');
      finishTicket();
      renderTicketActions();
      return;
    }
    tk.firstTry = false;
    record(false);
    stamp('fail', 'Fail · retest');
    if (v.reason === 'error') { setStatus('bad', `<b>SQL error:</b> ${esc(v.message)}`); r.innerHTML = ''; return; }
    const colHelp = v.reason === 'cols' && ticket.headers ? ` Needed: ${ticket.headers.map((h) => esc(h.text)).join(', ')}.` : '';
    setStatus('bad', `<b>Not quite.</b> ${esc(v.message)}${colHelp}`);
    if (v.reason === 'rows' || v.reason === 'order') {
      r.innerHTML = `<div class="diff">
        <div><h3>Your result <span class="legend extra">shouldn't be there</span></h3>${tableHTML(got.columns, got.rows, v.gotMarks)}</div>
        <div><h3>Expected <span class="legend missing">missing from yours</span></h3>${tableHTML(ticket.expected.columns, ticket.expected.rows, v.expMarks)}</div>
      </div>`;
    } else r.innerHTML = tableHTML(got.columns, got.rows);
  }

  // ---------- controls ----------
  $('#btnTiers').onclick = () => { if (SQL) { focus = null; renderTiers(); } };
  $('#tierMode').onchange = (e) => { S.tierMode = e.target.value; S.inbox = []; save(); updateStats(); if (SQL) { fillInbox(); renderMap(); } };
  let confirmTimer = null;
  $('#btnHospital').onclick = (e) => {
    const b = e.currentTarget;
    if (!b.dataset.confirm) { b.dataset.confirm = '1'; b.textContent = 'Click again to confirm'; clearTimeout(confirmTimer); confirmTimer = setTimeout(() => { delete b.dataset.confirm; b.textContent = 'New hospital'; }, 3000); return; }
    delete b.dataset.confirm; b.textContent = 'New hospital';
    S.seed = Math.floor(Math.random() * 1e9); save(); loadHospital(); fillInbox(); renderMap(); toast('New hospital loaded. Same skills, new data.');
  };

  // ---------- boot ----------
  updateStats();
  if (!window.initSqlJs || !window.CodeMirror) { $('#loading').innerHTML = '<div>The SQL engine didn\'t load. Check your connection and reload the page.</div>'; return; }
  initSqlJs().then((lib) => { SQL = lib; loadHospital(); fillInbox(); renderMap(); })
    .catch((e) => { $('#loading').innerHTML = `<div>The SQL engine didn't start: ${esc(e.message || e)}</div>`; });
})();

</script>
